services:
  signalr-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalr-emulator
    ports:
      - "8888:8888"
    volumes:
      - ./signalr-emulator.settings.json:/app/settings.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - signalr-fun

  message-hub:
    build:
      context: ./MessageHub
    container_name: message-hub
    # Published on 7071 so the emulator's host.docker.internal:7071 upstream, the Vite
    # /api proxy and the .vscode/.zed tasks all keep working unchanged. Stop this service
    # to free the port and run `func start` on the host instead.
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ServiceBusConnection: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      # Double underscores, not colons: .NET config maps __ to : when reading env vars,
      # which is what the %...% binding expressions resolve against.
      Email__ServiceBus__DefaultQueue: "signalr-fun-notifications"
      # Endpoint is how *this container* reaches the emulator; ClientEndpoint is what
      # negotiate hands the *browser*, which can't resolve compose service names.
      AzureSignalRConnectionString: "Endpoint=http://signalr-emulator:8888;AccessKey=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGH;Version=1.0;ClientEndpoint=http://localhost:8888;"
      Notifications__HubName: "notifications"
      # Plain http: the vnext emulator serves the gateway over HTTP, so there is no
      # certificate to import. The SDK is pinned to this endpoint with LimitToEndpoint
      # (see Program.cs) because the emulator advertises localhost:8081 as its writable
      # location, which from in here would resolve to this container.
      CosmosConnection: "AccountEndpoint=http://cosmosdb-emulator:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
      Cosmos__DatabaseId: "log"
      Cosmos__ContainerId: "notifications"
    depends_on:
      azurite:
        condition: service_started
      # Unlike the Service Bus emulator, this image has a shell and curl, so it can carry a
      # real healthcheck and gate startup properly instead of needing an entrypoint wait.
      cosmosdb-emulator:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      signalr-emulator:
        condition: service_started
    # The Service Bus emulator has no shell, so it can't carry a healthcheck; the wait for
    # it lives in MessageHub/docker-entrypoint.sh instead. This policy is only a safety net
    # for a genuine crash — the Functions host does not exit when a listener can't connect.
    restart: on-failure
    # `docker compose watch` rebuilds and recreates the container on save. Rebuilding
    # beats an in-container dotnet watch, which re-registers functions into a live host.
    develop:
      watch:
        - action: rebuild
          path: ./MessageHub
          ignore:
            - bin/
            - obj/
            - .vscode/
            - local.settings.json
    networks:
      - signalr-fun

  message-receiver:
    build:
      context: ./MessageReceiver
    container_name: message-receiver
    # 1:1 mapping is deliberate. Vite's HMR client connects back to the same
    # host:port the page was served from, so remapping would break hot reload.
    ports:
      - "5173:5173"
    environment:
      # Hairpins through the published host port 7071 -- the same trick the
      # signalr-emulator upstream uses. message-hub:80 would be one hop shorter
      # but would break the `docker compose stop message-hub` + `func start`
      # fallback, since that moves the function off the compose network.
      API_PROXY_TARGET: "http://host.docker.internal:7071"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - message-hub
    develop:
      watch:
        # Source edits sync into the running container; Vite hot-reloads them.
        # No rebuild, unlike message-hub -- Vite's HMR is reliable where an
        # in-container dotnet watch was not.
        - action: sync
          path: ./MessageReceiver
          target: /app
          ignore:
            - node_modules/
            - dist/
        # Dependencies are the only thing that needs a new image.
        - action: rebuild
          path: ./MessageReceiver/package.json
        - action: rebuild
          path: ./MessageReceiver/package-lock.json
    networks:
      - signalr-fun

  message-sender:
    build:
      context: ./MessageSender
    container_name: message-sender
    # 1:1 mapping for the same reason as message-receiver -- Vite's HMR client connects
    # back to the host:port the page was served from. 5175 rather than 5174, because 5174
    # is exactly where Vite silently lands when 5173 is already taken.
    ports:
      - "5175:5175"
    environment:
      # Same hairpin as message-receiver: through the published host port, so
      # `docker compose stop message-hub` + `func start` on the host keeps working.
      API_PROXY_TARGET: "http://host.docker.internal:7071"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - message-hub
    develop:
      watch:
        - action: sync
          path: ./MessageSender
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./MessageSender/package.json
        - action: rebuild
          path: ./MessageSender/package-lock.json
    networks:
      - signalr-fun

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - signalr-fun

  cosmosdb-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260810
    container_name: cosmosdb-emulator
    ports:
      - "8081:8081"
      - "8080:8080"
      - "1234:1234"
    # Named volume, not a bind mount. /data holds a Postgres cluster owned by uid 1000
    # (cosmosdev); Docker seeds a new *named* volume from the image's content and ownership,
    # whereas a host bind mount would start empty and root-owned and Postgres would fail to
    # initialise. Reset the data with `docker compose down -v`.
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - signalr-fun

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    container_name: servicebus-emulator
    pull_policy: always
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./servicebus-emulator.config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
      MSSQL_SA_PASSWORD: "1StrongPwd!!"
      SQL_SERVER: mssql
    depends_on:
      - mssql
    networks:
      - signalr-fun

  # Backing store for servicebus-emulator's own config/state, not a service any
  # app code talks to directly. No volume: data is disposable and gets rebuilt
  # from servicebus-emulator.config.json on every `docker compose up`.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: servicebus-emulator-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1StrongPwd!!"
      MSSQL_PID: "Developer"
    networks:
      - signalr-fun

networks:
  signalr-fun:

volumes:
  # Keeps notifications across `docker compose down`. Tied to the Postgres major version
  # inside the pinned emulator image -- bumping that tag may require `down -v`.
  cosmos-data:
