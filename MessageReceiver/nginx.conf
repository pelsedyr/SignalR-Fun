server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Resolving through a variable defers the lookup until a request,
    # so the frontend can start cleanly while MessageHub is still coming up.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser API same-origin. This replaces Vite's development-only proxy.
    location /api/ {
        set $message_hub http://message-hub:80;
        proxy_pass $message_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
