# Demo deployment stack. It pulls pre-built images and serves the React bundle with Nginx
# instead of Vite, but otherwise publishes the same host ports as docker-compose.yaml, so it's
# a drop-in swap for trying a built image without the source-watching dev containers running.
#
# Required:
#   SIGNALR_CLIENT_ENDPOINT=https://signalr-notifications.example.net
# Optional:
#   IMAGE_PREFIX=registry.example.net/registry/signalr-fun  IMAGE_TAG=1.0.0
#
# The network is owned by this project (like docker-compose.yaml's), so no manual
# `docker network create` step is needed and `down` cleans it up. If Nginx Proxy Manager ever
# needs to run on this same Docker host and reach containers by name instead of by published
# port, make the `signalr-fun` network below `external: true`, create it once with
# `docker network create signalr-fun`, and attach NPM's own Compose project to that same name.
name: signalr-fun-registry

services:
  signalr-emulator:
    image: "${IMAGE_PREFIX:-signalr-fun}/signalr-emulator:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # Host 18888 rather than 8888, which the avdekl Aspire AppHost's emulator holds. A reverse
    # proxy in front of SIGNALR_CLIENT_ENDPOINT must forward to this port.
    ports:
      - "18888:8888"
    volumes:
      - ./signalr-emulator.settings.registry.json:/app/settings.json:ro
    networks:
      - signalr-fun

  message-hub:
    image: "${IMAGE_PREFIX:-signalr-fun}/message-hub:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ServiceBusConnection: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      Email__ServiceBus__DefaultQueue: "signalr-fun-notifications"
      # Endpoint is internal Docker DNS. ClientEndpoint is deliberately required, so the
      # negotiate response always contains an address the browser can resolve.
      AzureSignalRConnectionString: "Endpoint=http://signalr-emulator:8888;AccessKey=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGH;Version=1.0;ClientEndpoint=${SIGNALR_CLIENT_ENDPOINT:?Set SIGNALR_CLIENT_ENDPOINT to the public HTTPS SignalR URL};"
      Notifications__HubName: "notifications"
      CosmosConnection: "AccountEndpoint=http://cosmosdb-emulator:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
      Cosmos__DatabaseId: "log"
      Cosmos__ContainerId: "notifications"
    depends_on:
      azurite:
        condition: service_started
      cosmosdb-emulator:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      signalr-emulator:
        condition: service_started
    networks:
      - signalr-fun

  message-receiver:
    image: "${IMAGE_PREFIX:-signalr-fun}/message-receiver:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # Host port matches docker-compose.yaml's Vite port for consistency, even though this
    # container serves the built bundle over Nginx on 80 instead (no HMR to keep aligned).
    ports:
      - "5173:80"
    depends_on:
      - message-hub
    networks:
      - signalr-fun

  message-sender:
    image: "${IMAGE_PREFIX:-signalr-fun}/message-sender:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # Host port matches docker-compose.yaml's Vite port for consistency, even though this
    # container serves the built bundle over Nginx on 80 instead (no HMR to keep aligned).
    ports:
      - "5175:80"
    depends_on:
      - message-hub
    networks:
      - signalr-fun

  # Infrastructure below mirrors the avdekl Aspire AppHost, exactly as in docker-compose.yaml:
  # same pinned tags, and Cosmos/Service Bus/MSSQL on the same fixed host ports. Stop Aspire's persistent containers before `up`, or these
  # fail to bind their ports (`./containers.sh stop` in ac-avdekl/src/avdekl-aspire).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - signalr-fun

  cosmosdb-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260907
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "7504:1234"
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - signalr-fun

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./servicebus-emulator.config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
      MSSQL_SA_PASSWORD: "1StrongPwd!!"
      SQL_SERVER: mssql
    depends_on:
      - mssql
    networks:
      - signalr-fun

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1StrongPwd!!"
      MSSQL_PID: "Developer"
    networks:
      - signalr-fun

networks:
  signalr-fun:

volumes:
  cosmos-data:
